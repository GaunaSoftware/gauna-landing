name: DeCA guide release
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  delivery-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
      - run: node --test tests/deca-delivery.test.mjs
  approved-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
      - run: node scripts/verify-guide.mjs

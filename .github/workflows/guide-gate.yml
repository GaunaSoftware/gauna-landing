name: Guide email access
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  review-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: mkdir -p test-output && git archive HEAD -o test-output/guide-gate-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: guide-gate-source
          path: test-output/guide-gate-source.zip
          retention-days: 1
